name: Build & Release .deb

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write # nötig, damit softprops/action-gh-release ein Release anlegen darf

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build-Abhängigkeiten installieren
        run: sudo apt-get update && sudo apt-get install -y build-essential debhelper dpkg-dev

      - name: .deb bauen
        run: ./scripts/build-deb.sh

      - name: Release-Text aus debian/changelog bauen
        run: ./scripts/release-notes.sh > RELEASE_NOTES.md

      - name: Release erstellen + .deb anhängen
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.deb
          # Installationsbefehl + "Neu in dieser Version" aus debian/changelog;
          # GitHub hängt die automatischen Notizen (Commit-Liste) darunter an.
          body_path: RELEASE_NOTES.md
          generate_release_notes: true
        if: startsWith(github.ref, 'refs/tags/')

      - name: Artefakt hochladen (auch bei manuellem Lauf ohne Tag)
        uses: actions/upload-artifact@v4
        with:
          name: goldfish-linux-deb
          path: dist/*.deb
