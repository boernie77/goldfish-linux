[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "goldfish-linux"
version = "0.1.37"
description = "Nativer GTK4/libadwaita-Client für den Goldfish-Videoserver"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "boernie77" }]
dependencies = ["requests>=2.28"]

[project.urls]
Homepage = "https://github.com/boernie77/goldfish-linux"
Server = "https://github.com/boernie77/goldfish"

[project.scripts]
goldfish = "goldfish_linux.__main__:main"

[tool.setuptools]
packages = [
    "goldfish_linux",
    "goldfish_linux.windows",
    "goldfish_linux.widgets",
]
